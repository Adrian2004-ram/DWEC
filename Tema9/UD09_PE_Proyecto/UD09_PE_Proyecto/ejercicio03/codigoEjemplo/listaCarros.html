<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Carros</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container-fluid p-5">
        <div class="row">
            <div class="col-md-4">
                <h2>Lista de Carros</h2>
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Usuario ID</th>
                            <th>Fecha</th>
                        </tr>
                    </thead>
                    <tbody id="carts-table-body">
                    </tbody>
                </table>
            </div>
            <div class="col-md-7" id="cart-details">
                
                
                <div id="cart-details-content"></div>
                    <h1>Detalles del Carro (ID: 1)</h1>
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>ID del Producto</th>
                                <th>Cantidad</th>
                                <th>Título</th>
                                <th>Imagen</th>
                                <th>Precio</th>
                            </tr>
                        </thead>
                        <tbody id="cart-details-body">
                        </tbody>
                    </table>
                </div>
                
            </div>
        </div>
    </div>
    

</body>
</html>
