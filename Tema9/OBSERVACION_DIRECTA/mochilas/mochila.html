<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body>
    
    <!-- Representa una mochila -->
    <div class="card mb-3" style="max-width: 540px;">
        <div class="row g-0">
    
            <!-- Imagen -->
            <div class="col-md-4 text-center p-2">
                <img src="img/1517932601.jpg" class="img-fluid rounded-start" alt="Timbuk2, un modelo elegante y espacioso"
                    style="max-height: 150px; object-fit: contain;">
            </div>
    
            <!-- Contenido -->
            <div class="col-md-8">
                <div class="card-body">
                    <h5 class="card-title">
                        Timbuk2, un modelo elegante y espacioso
                    </h5>
    
                    <p class="card-text small text-muted mb-1">
                        <strong>Uso:</strong> Office ·
                        <strong>Género:</strong> Male
                    </p>
    
                    <p class="card-text">
                        Este modelo destaca por su amplio espacio y diseño, que se distingue de la clásica apariencia de
                        este tipo de mochilas...
                    </p>
    
                    <p class="card-text">
                        <strong>Precio:</strong> 109 €<br>
                        <strong>Tienda:</strong> Amazon
                    </p>
    
                    <a href="#" class="btn btn-primary btn-sm">
                        Ver en la tienda
                    </a>
                </div>
            </div>
    
        </div>
    </div>


</body>
</html>
